name: Update Visual Baselines

# Manually triggered from the Actions tab.
#
# USAGE:
#   1. Go to Actions → "Update Visual Baselines" → Run workflow
#   2. Leave "branch" as `main` to update main after a merged change, OR
#      enter a PR branch (e.g. `squad/issue-26-m4-polish`) to bless
#      intentional UI changes on that PR before review.
#   3. Leave "commit_baselines" checked for automated commits, OR uncheck it
#      to generate/upload artifacts only for review and a manual commit.
#   4. Click "Run workflow".
#
# WHAT HAPPENS:
#   - Always: generate and upload snapshots in the pinned CI container.
#   - With commit_baselines=false: skip the entire commit job; no commits,
#     pushes, PR creation, or merge requests are made.
#   - With commit_baselines=true (default): commit directly to a non-main
#     branch, or create a `baselines/auto-<run-id>` PR with auto-merge for main.
#     Branch protection still prevents a direct push to main.
#   - GITHUB_TOKEN-originated events do not guarantee automatic checks or
#     deployment. PR runs may need maintainer approval; token-originated
#     pushes do not trigger push workflows. Verify all four required checks
#     on the latest PR commit and the deployment after merge (see README).
#
# ⚠️ Use the same pinned container as CI for consistent font rendering:
#    mcr.microsoft.com/playwright:v1.61.1-noble. A Linux host alone is not enough.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch for baseline regeneration (default: main). Enter a PR branch name to bless UI changes on that PR.'
        required: false
        default: 'main'
      commit_baselines:
        description: 'Commit snapshots and update branches/PRs. Uncheck to upload artifacts only for review and a manual commit.'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Job 1: Run tests inside the Playwright container ──────────────────────
  generate-baselines:
    name: Regenerate Visual Baselines (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site (visual tests need a served dist/)
        run: npm run build

      - name: Regenerate visual baselines
        run: npm run test:visual:update

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/e2e/__snapshots__/
          if-no-files-found: warn

  # ── Job 2: Commit baselines on a plain runner (gh CLI available) ───────────
  commit-baselines:
    name: Commit baselines to branch
    needs: generate-baselines
    # inputs preserves booleans; github.event.inputs would contain strings.
    if: ${{ inputs.commit_baselines }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download snapshot artifacts
        uses: actions/download-artifact@v4
        with:
          name: visual-snapshots
          path: tests/e2e/__snapshots__/

      - name: Commit and push baselines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__snapshots__/
          if git diff --staged --quiet; then
            echo "Baselines unchanged — nothing to commit."
            exit 0
          fi

          if [ "$TARGET_BRANCH" = "main" ]; then
            # For main: branch protection blocks direct push.
            # Create a baselines/* branch, open PR, enable auto-merge.
            BASELINE_BRANCH="baselines/auto-${GITHUB_RUN_ID}"
            git checkout -b "$BASELINE_BRANCH"
            git commit -m "test(visual): regenerate Linux baselines"
            git push origin "$BASELINE_BRANCH"
            gh pr create \
              --title "test(visual): regenerate Linux baselines" \
              --body "Automated baseline update from workflow run \`${GITHUB_RUN_ID}\`. Auto-merge is requested, but GITHUB_TOKEN-originated events do not guarantee automatic checks or deployment. A maintainer must approve or trigger any missing checks and verify all four required checks on the latest PR commit before merge. See README for recovery and deployment verification." \
              --base main \
              --head "$BASELINE_BRANCH"
            gh pr merge "$BASELINE_BRANCH" --auto --squash
            echo "PR opened and auto-merge requested; verify all four required checks on the latest PR commit."
          else
            # For a non-main target: push directly, subject to its branch rules.
            # Never add CI-skip markers to either commit message: they can leave
            # required checks pending and suppress deployment after squash merge.
            git commit -m "test(visual): regenerate Linux baselines for ${TARGET_BRANCH}"
            git push origin HEAD:"$TARGET_BRANCH"
            echo "Baselines committed directly to ${TARGET_BRANCH}."
          fi
          echo "GITHUB_TOKEN events may need maintainer action for checks; verify deployment after merge. See README."

